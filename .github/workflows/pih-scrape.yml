name: PIH Notices Ingest

on:
  # Run after the scraper pushes a manifest change
  workflow_run:
    workflows: ["PIH Notices Scrape"]
    types: [completed]
  # Also allow manual runs
  workflow_dispatch:
    inputs:
      limit:
        description: "Max notices to ingest this run (blank = all pending)"
        required: false
        default: ""
      only:
        description: "Specific notice IDs (space-separated, e.g. PIH-2025-30 PIH-2026-16)"
        required: false
        default: ""

permissions:
  contents: write   # to commit updated ingested_state.json

jobs:
  ingest:
    # For workflow_run: only run if the scraper succeeded
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main       # ensure we see the manifest the scraper just pushed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests numpy PyMuPDF sentence-transformers huggingface_hub

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-large-en-v1.5

      - name: Ingest new notices
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          python pipeline/ingest_new_notices.py $ARGS | tee pipeline/last_ingest_report.md

      - name: Commit ingested state
        run: |
          git config user.name "housingmind-bot"
          git config user.email "bot@housingmind.io"
          # -A stages new/modified/deleted, tolerant if either file is missing
          git add -A pipeline/
          if git diff --cached --quiet; then
            echo "Nothing new ingested."
          else
            git commit -m "chore: ingested new PIH notices"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## PIH Ingest Result" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pipeline/last_ingest_report.md >> $GITHUB_STEP_SUMMARY || echo "(no report)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
